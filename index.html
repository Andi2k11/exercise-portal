<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matematikplattform</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- KaTeX (text rendering only) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="window.katexAutoRenderLoaded = true"></script>

    <!-- Project styles -->
    <link rel="stylesheet" href="assets/css/custom.css?v=20260920T0000">
    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <div id="card-wrapper">
      <div class="card-container">
        <div class="card full-card no-exercise">
          <header class="card-header">
            <div class="header-row" role="toolbar" aria-label="Header menu">
              <div class="menu-slot slot-left">
                <select id="book-select" class="form-select" aria-label="Välj bok">
                  <option value="">Välj bok</option>
                </select>
              </div>
              <div class="menu-slot slot-center">
                <select id="chapter-select" class="form-select" aria-label="Välj kapitel">
                  <option value="">Välj kapitel</option>
                </select>
              </div>
              <div class="menu-slot slot-right">
                <select id="exercise-select" class="form-select" aria-label="Välj övning">
                  <option value="">Välj övning</option>
                </select>
              </div>
            </div>
          </header>
          <div class="card-body">
            <div class="sub-card card">
              <div class="card-body d-flex flex-column">
                <div id="question-text" class="question-text mb-2">
                  Här kommer frågan att visas (LaTeX tillåten)
                </div>
                <div class="line-break" aria-hidden="true"></div>
                <div id="task-expression" class="task-expression">
                  Här kommer talet/uttrycket att visas (LaTeX tillåten)
                </div>
              </div>
            </div>

            <div class="split-area">
              <div class="split-left">
                <div class="inner-card card">
                  <div class="card-body d-flex flex-column">
                    <div class="value-entry">
                      <div class="d-flex align-items-center mb-2">
                        <label for="value-field" class="form-label me-2 mb-0">Svar:</label>
                        <input id="value-field" class="form-control" type="text" aria-label="Värde">
                      </div>
                      <div id="input-area" class="mt-2"></div>
                    </div>

                    <div class="flash-area" aria-live="polite" aria-atomic="true">
                      <div id="flash-msg" class="flash-msg visually-hidden"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="split-right">
                <div class="inner-card card">
                  <div class="card-body">
                    <div class="input-pad" role="group" aria-label="Inmatningskontroll" id="mock-pad">
                      <!-- buttons filled by CSS/JS - kept static in layout -->
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="exercise-summary" class="exercise-summary visually-hidden" role="status" aria-live="polite">
              <div class="summary-card card">
                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                  <div id="summary-percent" class="summary-percent">0%</div>
                  <button type="button" id="summary-restart" class="btn btn-primary summary-restart visually-hidden">Börja om</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Engine modules must load before app.js -->
    <script type="module" src="engine/manifest.js" defer></script>
    <script type="module" src="engine/loader.js" defer></script>
    <script type="module" src="assets/js/app.js?v=20260920T0000" defer></script>
  </body>
</html>
