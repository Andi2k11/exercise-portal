<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matematikövningar</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- KaTeX (pinned) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body)"></script>

    <!-- mathjs (expression parser only) -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathjs@11.9.0/lib/browser/math.js"></script>

    <!-- Project styles (cache-busted) -->
    <link rel="stylesheet" href="assets/css/custom.css?v=20260919T0000">
  </head>
  <body>
    <div id="card-wrapper">
      <div class="card-container">
        <div class="card full-card no-exercise">
          <header class="card-header">
            <!-- Centered menu header slots -->
            <div class="header-row" role="toolbar" aria-label="Header menu">
              <div class="menu-slot slot-left">
                <select id="book-select" class="form-select" aria-label="Välj bok">
                  <option value="">Välj bok</option>
                </select>
              </div>
              <div class="menu-slot slot-center">
                <select id="chapter-select" class="form-select" aria-label="Välj kapitel">
                  <option value="">Välj kapitel</option>
                </select>
              </div>
              <div class="menu-slot slot-right">
                <select id="exercise-select" class="form-select" aria-label="Välj övning">
                  <option value="">Välj övning</option>
                </select>
              </div>
            </div>
          </header>
          <div class="card-body">
            <div class="sub-card card">
              <div class="card-body d-flex flex-column">
                <div id="question-text" class="question-text mb-2">
                  Här kommer frågan att visas (LaTeX tillåten)
                </div>
                <div class="line-break" aria-hidden="true"></div>
                <div class="line-break" aria-hidden="true"></div>
                <div id="task-expression" class="task-expression">
                  Här kommer talet/uttrycket att visas (LaTeX tillåten)
                </div>
              </div>
            </div>

            <div class="split-area">
              <div class="split-left">
                <div class="inner-card card">
                  <div class="card-body d-flex flex-column">
                    <!-- Answer area: label + input -->
                    <div class="value-entry">
                      <div class="d-flex align-items-center mb-2">
                        <label for="value-field" class="form-label me-2 mb-0">Svar:</label>
                        <input
                          id="value-field"
                          class="form-control"
                          type="text"
                          aria-label="Värde">
                      </div>
                    </div>

                    <!-- Reserved flash message area: fixed height so showing messages won't push content -->
                    <div class="flash-area" aria-live="polite" aria-atomic="true">
                      <div id="flash-msg" class="flash-msg visually-hidden"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="split-right">
                <div class="inner-card card">
                  <div class="card-body">
                    <div class="input-pad" role="group" aria-label="Inmatningskontroll">
                      <div class="pad-row">
                        <button type="button" class="pad-btn">(</button>
                        <button type="button" class="pad-btn">)</button>
                        <button type="button" class="pad-btn" aria-label="upphöjt till">xⁿ</button>
                        <button type="button" class="pad-btn">√</button>
                      </div>
                      <div class="pad-row">
                        <button type="button" class="pad-btn">7</button>
                        <button type="button" class="pad-btn">8</button>
                        <button type="button" class="pad-btn">9</button>
                        <button type="button" class="pad-btn">*</button>
                      </div>
                      <div class="pad-row">
                        <button type="button" class="pad-btn">4</button>
                        <button type="button" class="pad-btn">5</button>
                        <button type="button" class="pad-btn">6</button>
                        <button type="button" class="pad-btn">/</button>
                      </div>
                      <div class="pad-row">
                        <button type="button" class="pad-btn">1</button>
                        <button type="button" class="pad-btn">2</button>
                        <button type="button" class="pad-btn">3</button>
                        <button type="button" class="pad-btn">-</button>
                      </div>
                      <div class="pad-row">
                        <button type="button" class="pad-btn">0</button>
                        <button type="button" class="pad-btn">,</button>
                        <button type="button" class="pad-btn">⌫</button>
                        <button type="button" class="pad-btn">+</button>
                      </div>
                      <div class="pad-row">
                        <button type="button" class="pad-btn">◀</button>
                        <button type="button" class="pad-btn">▶</button>
                        <button type="button" class="pad-btn">C</button>
                        <button type="button" class="pad-btn">Enter</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- Summary area (hidden until exercise complete) -->
            <div
              id="exercise-summary"
              class="exercise-summary visually-hidden"
              role="status"
              aria-live="polite"
            >
                  <div class="summary-card card">
                <div class="card-body d-flex flex-column align-items-center justify-content-center">
                  <div id="summary-percent" class="summary-percent">0%</div>
                  <button
                    type="button"
                    id="summary-restart"
                    class="btn btn-primary summary-restart visually-hidden"
                  >
                    Börja om
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Project JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>

    <script type="module" src="engine/expression.js?v=20260919T0000" defer></script>
    <script type="module" src="engine/question-engine.js?v=20260919T0000" defer></script>
    <script type="module" src="engine/answer-engine.js?v=20260919T0000" defer></script>
    <script type="module" src="engine/localStorage.js?v=20260919T0000" defer></script>
    <script type="module" src="assets/js/app.js?v=20260919T0000" defer></script>
  </body>
</html>
